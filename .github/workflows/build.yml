name: Linux build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        cross_tool: [ "m68k-atari-mint" ]
    steps:
      - uses: actions/checkout@v4
      - name: Setup environment
        env:
          CROSS_TOOL: ${{ matrix.cross_tool }}
        run: ./.scripts/setup_env.sh
      - name: Install packages
        run: |
          SYSROOT_DIR="/" ./.scripts/install-freemint.sh binutils gcc mintbin
          ./.scripts/install-freemint.sh mintlib gemlib cflib fdlibm
          ./.scripts/install-libs.sh zlib-1.2.12-mint-20220914-dev.tar.xz
      - name: build
        run: ./.scripts/build.sh
      - name: package
        if: ${{ github.event_name == 'push' }}
        run: ./.scripts/package.sh
      - name: point the rolling tag at this build
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pushing the tag with git is refused whenever the commit it points at
          # touches .github/workflows, which the token may not write.  Moving the
          # ref through the API asks for no such thing.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" \
            -f sha="$GITHUB_SHA" -F force=true --silent
      - name: publish snapshot
        if: ${{ github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          # No name or body here on purpose: the action overwrites whatever it is
          # given, so a hand written title or notes on the release would be reset
          # by the next build.  Leaving them out keeps what is there.
          files: ${{ env.DEPLOY_DIR }}/*.zip
